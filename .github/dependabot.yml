version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      web:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api:
        patterns:
          - "*"
