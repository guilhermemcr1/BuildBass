# BuildBass em produção: um único domínio público.
#
#   navegador ──► web (nginx) ─┬─ SPA estática        (/)
#                              └─ proxy interno ──► api (/api, /up, /moderation, /storage, ...)
#
# Só o serviço `web` (porta 80) é exposto; api e scheduler ficam na rede interna.
#
# Banco: fica FORA deste projeto, no MariaDB compartilhado criado no Dokploy. A api e o
# scheduler entram na rede do Dokploy (`dokploy-network`) e usam como DB_HOST o "Internal Host"
# (App Name) que o Dokploy mostra na tela do banco. Nessa rede há serviços de outros projetos,
# então o nginx chama a API por um nome único (`buildbass-api`), nunca por `api`.
# Como o front e a API respondem no mesmo domínio, o front chama a API por URL relativa
# (VITE_API_URL vazio) e não há CORS nem subdomínio extra.
#
# Variáveis obrigatórias: APP_KEY, APP_URL, DB_HOST, DB_PASSWORD (as demais têm padrão).
# Do banco, opcionais: DB_PORT, DB_DATABASE, DB_USERNAME, DB_NETWORK.
#
# Fuso: os containers rodam em TZ (padrão America/Sao_Paulo), então logs do nginx e do PHP-FPM saem
# na hora local; os do Laravel seguem APP_DISPLAY_TIMEZONE (mesmo padrão). O banco continua gravando
# em UTC (sessão forçada em +00:00); o painel mostra em APP_DISPLAY_TIMEZONE, e o "dia" das cotas
# diárias da IA e dos gráficos do painel vira à meia-noite desse fuso. Mantenha TZ e
# APP_DISPLAY_TIMEZONE iguais.
#
# DNS: resolvedores fixos (DNS_PRIMARY/DNS_SECONDARY) para as chamadas externas da API
# (Turnstile, OpenRouter, SMTP) não dependerem do DNS do host. Nomes internos (buildbass-api e o
# host do banco) continuam resolvidos pelo DNS embutido do Docker.

x-dns: &dns
  - ${DNS_PRIMARY:-1.1.1.1}
  - ${DNS_SECONDARY:-8.8.8.8}

x-api: &api
  build: ./api
  restart: unless-stopped
  dns: *dns
  # `default` fala com o web; `banco` é a rede do Dokploy, onde está o MariaDB compartilhado
  # (outro projeto, por isso sem depends_on: se o banco cair, a API responde erro até ele voltar).
  networks:
    - default
    - banco
  environment: &api-env
    TZ: ${TZ:-America/Sao_Paulo}
    APP_NAME: BuildBass
    APP_DISPLAY_TIMEZONE: ${APP_DISPLAY_TIMEZONE:-America/Sao_Paulo}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: "${APP_KEY:?defina APP_KEY}"
    APP_URL: "${APP_URL:?defina APP_URL, ex. https://meudominio.com.br}"
    # Mesma origem do front; só importa se um dia o front sair para outro domínio.
    FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    DB_CONNECTION: mariadb
    # Internal Host do banco no Dokploy (ex.: mariadb-geral-a1b2c3).
    DB_HOST: "${DB_HOST:?defina DB_HOST (Internal Host do MariaDB no Dokploy)}"
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:-buildbass}
    DB_USERNAME: ${DB_USERNAME:-buildbass}
    DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD}"

    # Cache e sessão em arquivo, no volume `storage`: com uma única instância da API não precisa de
    # Redis nem de escrita no banco a cada requisição, e os contadores de limite (inclusive a cota
    # diária da leitura de manual) sobrevivem aos deploys. Com várias instâncias, troque por redis.
    CACHE_STORE: file
    SESSION_DRIVER: file
    # O site só é servido por HTTPS (Cloudflare): o cookie de sessão do painel nunca vai em HTTP.
    SESSION_SECURE_COOKIE: "true"
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}

    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}

    TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
    TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}

    MANUAL_EXTRACTION_ENABLED: ${MANUAL_EXTRACTION_ENABLED:-false}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
    BOX_SUGGESTION_ENABLED: ${BOX_SUGGESTION_ENABLED:-false}
    BOX_SUGGESTION_MODEL: ${BOX_SUGGESTION_MODEL:-}
    BOX_SUGGESTION_HOURLY_LIMIT: ${BOX_SUGGESTION_HOURLY_LIMIT:-8}
    BOX_SUGGESTION_DAILY_CAP: ${BOX_SUGGESTION_DAILY_CAP:-50}
    AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    # Bloqueio automático de IP após envios suspeitos (anti-robô, validação, limite por hora).
    ABUSE_MAX_STRIKES: ${ABUSE_MAX_STRIKES:-10}
    ABUSE_WINDOW_MINUTES: ${ABUSE_WINDOW_MINUTES:-60}
    ABUSE_BLOCK_MINUTES: ${ABUSE_BLOCK_MINUTES:-360}

services:
  web:
    build:
      context: ./web
      args:
        # Vazio de propósito: o front chama /api/... no próprio domínio.
        VITE_API_URL: ""
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    dns: *dns
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      - api
    volumes:
      # Só leitura: o nginx serve as imagens dos drivers direto do disco, sem passar pelo PHP.
      - api-storage:/srv/api-storage:ro
    expose:
      - "80"

  api:
    <<: *api
    networks:
      default:
        # Nome único para o nginx do `web`; `api` pode colidir com outro projeto na rede do Dokploy.
        aliases:
          - buildbass-api
      banco: {}
    environment:
      <<: *api-env
      # Migrations ficam por sua conta (terminal do serviço); true migra a cada deploy.
      AUTORUN_LARAVEL_MIGRATION: ${AUTORUN_LARAVEL_MIGRATION:-false}
      # Pool do PHP-FPM: ajuste PHP_FPM_PM_MAX_CHILDREN à RAM do servidor (~50 MB por worker).
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-10}
      PHP_FPM_PM_START_SERVERS: "3"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "2"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "5"
      # Recicla o worker de tempos em tempos para conter vazamento de memória.
      PHP_FPM_PM_MAX_REQUESTS: "500"
    volumes:
      # Imagens dos drivers (storage/app/public) precisam sobreviver aos deploys.
      - api-storage:/var/www/html/storage
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Roda `schedule:run` a cada minuto (audit:prune diário). Mesma imagem da API, sem web server.
  scheduler:
    <<: *api
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *api-env
      AUTORUN_ENABLED: "false"

volumes:
  api-storage:

networks:
  # Rede do Dokploy (já existe no servidor); aqui só se usa.
  banco:
    external: true
    name: ${DB_NETWORK:-dokploy-network}
