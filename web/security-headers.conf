# Cabeçalhos de segurança das respostas servidas pelo próprio nginx (SPA, assets, imagens).
# As rotas da API já recebem os seus do nginx da imagem PHP; por isso este arquivo é incluído
# só nos blocos estáticos (um add_header dentro de location descarta os herdados do server).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Sem restringir scripts (o index.html tem um script inline de tema e o envio usa o Turnstile):
# impede o site de ser embutido por terceiros, plugins e troca do <base>.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
