# Atrás do Cloudflare (tunnel) + proxy de borda, o IP e o esquema que chegam aqui podem ser os do
# conector, não os do visitante. O Cloudflare informa os reais em CF-Connecting-IP e CF-Visitor;
# sem eles (acesso direto, testes), cai no X-Forwarded-* do proxy ou no esquema local.
# Isso importa: o limite de uso (catálogo e envio de driver) é por IP.
map $http_cf_connecting_ip $forwarded_for {
    default $http_cf_connecting_ip;
    ''      $proxy_add_x_forwarded_for;
}

map $http_cf_visitor $cf_proto {
    default '';
    ~"https" https;
}

map $http_x_forwarded_proto $edge_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $cf_proto $forwarded_proto {
    default $cf_proto;
    ''      $edge_proto;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: os .gz pré-gerados no build saem direto; o gzip dinâmico cobre o que vem da API.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json image/svg+xml;

    # Imagens dos drivers: servidas direto do volume da API (sem passar por PHP nem por outro proxy).
    # Os nomes são UUID e nunca mudam, então o cache pode ser eterno.
    location /storage/ {
        alias /srv/api-storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas que pertencem à API Laravel (serviço `api`): endpoints JSON, healthcheck, painel de
    # moderação (Filament/Livewire) e assets do painel.
    # O resolver do Docker evita que o nginx falhe na subida se a API ainda não estiver de pé.
    location ~ ^/(api|up|moderation|livewire|css/filament|js/filament|fonts)(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Envio de driver: PDF de até 10 MB + imagens (limite do PHP: 40M).
        client_max_body_size 40m;
        # Leitura de manual por IA: PDF (20 s) + provedor (45 s).
        proxy_read_timeout 120s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ícones sem hash no nome: cache de uma semana.
    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png)$ {
        access_log off;
        expires 7d;
    }

    # Fallback da SPA; o HTML nunca fica em cache para o deploy novo valer na hora.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
